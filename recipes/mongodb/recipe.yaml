# MongoDB, reachable inside the project as host `<service>` on 27017, its user the
# server's administrator (a development database: one user, one password). Its URL goes to whoever requires `mongodb` (MONGODB_URL). The data is
# kept in the project (.octopod/data) unless `persist: false`.
title: MongoDB
summary: Document database, reachable inside the project as host <service> on port 27017.
image: "mongo:{{params.version}}"
unpinned: true
build: true
provides: [mongodb]
params:
  version: { type: enum, values: ["8.0", "7.0", "6.0", "5.0"], default: "8.0" }
  db: { type: ident, default: app }
  user: { type: ident, default: app }
  password: { type: secret, bytes: 24 }
  persist: { type: bool, default: true }
env:
  MONGO_INITDB_ROOT_USERNAME: "{{params.user}}"
  MONGO_INITDB_ROOT_PASSWORD: "{{secrets.password}}"
  MONGO_INITDB_DATABASE: "{{params.db}}"
exports:
  host: "{{service}}"
  port: "27017"
  url: "mongodb://{{params.user}}:{{secrets.password}}@{{service}}:27017/{{params.db}}?authSource=admin"
volumes:
  - { name: data, path: /data/db, when: persist }
port: 27017
# mongosh from 6.0; the older images have the legacy shell.
health:
  test: [CMD-SHELL, "mongosh --quiet --eval 'db.adminCommand(\"ping\")' || mongo --quiet --eval 'db.adminCommand(\"ping\")'"]
  intervalMs: 2000
  retries: 30
limits: { memory: 1g, cpus: "1", pids: 512 }
# `octopod run <service> <action>`: the credentials are read in the container, from its
# environment. mongosh from 6.0; the older images have the legacy shell.
actions:
  shell:
    summary: the database's shell
    tty: true
    command: [sh, -c, 'if command -v mongosh >/dev/null; then s=mongosh; else s=mongo; fi; exec $s -u "$MONGO_INITDB_ROOT_USERNAME" -p "$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin "$MONGO_INITDB_DATABASE"']
  dump:
    summary: the database as a mongodump archive, on the standard output (octopod run docs dump > dump.archive)
    command: [sh, -c, 'exec mongodump --quiet --archive -u "$MONGO_INITDB_ROOT_USERNAME" -p "$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --db "$MONGO_INITDB_DATABASE"']
  load:
    summary: restores a mongodump archive, its collections replacing the database's (octopod run docs load dump.archive)
    input: true
    confirm: replaces in the database the collections the archive holds
    command: [sh, -c, 'exec mongorestore --quiet --archive --drop -u "$MONGO_INITDB_ROOT_USERNAME" -p "$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --nsInclude "$MONGO_INITDB_DATABASE.*"']
  reset:
    summary: drops the database
    confirm: deletes everything in the database
    command: [sh, -c, 'if command -v mongosh >/dev/null; then s=mongosh; else s=mongo; fi; exec $s --quiet -u "$MONGO_INITDB_ROOT_USERNAME" -p "$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin "$MONGO_INITDB_DATABASE" --eval "db.dropDatabase()"']
