# A Node web app: the project's own `dev` script (npm run dev) with HOST and PORT set,
# the project mounted at /app. Its dependencies are the project's: installed in the
# running app (npm install), never in the image.
title: Node 22 web app
summary: Runs the project's dev script (npm run dev) with HOST=0.0.0.0 and PORT=3000, served at http://<project>.octopod.localhost.
icon: icon.svg
image: node:22-bookworm-slim
unpinned: true
build: true
# The project's dev script. Before it, a word in the logs when the dependencies are not
# installed yet: the app will most likely die at start, and the way out is to install
# them (octopod exec, which works while the app restarts).
command:
  - sh
  - -c
  - >-
    if [ -f package.json ] && [ ! -d node_modules ]; then
    echo "node-app: no node_modules yet — install the dependencies (npm install) in this app" >&2;
    fi;
    exec npm run dev
env:
  HOST: 0.0.0.0
  PORT: "3000"
  NODE_ENV: development
  # Where no file event crosses the mount (Docker Desktop on Windows), dev servers poll:
  # chokidar (Vite and most tools) and watchpack (webpack, Next). Absent elsewhere.
  CHOKIDAR_USEPOLLING: "{{host.poll}}"
  WATCHPACK_POLLING: "{{host.poll}}"
workspace: /app
home: true
port: 3000
route: true
profiles: [dev]
requires:
  - capability: sql
    env: { DATABASE_URL: "{{provider.url}}" }
    optional: true
  - capability: redis
    env: { REDIS_URL: "{{provider.url}}" }
    optional: true
  - capability: memcached
    env: { MEMCACHED_URL: "{{provider.url}}" }
    optional: true
  - capability: mongodb
    env: { MONGODB_URL: "{{provider.url}}" }
    optional: true
  - capability: smtp
    env: { MAILER_DSN: "{{provider.url}}", SMTP_URL: "{{provider.url}}" }
    optional: true
  - capability: oidc
    env: { OIDC_ISSUER_BASE: "{{provider.issuer_base}}" }
    optional: true
tmpfs: [/tmp]
limits: { memory: 2g, cpus: "2", pids: 1024 }
# What runs in it, read in the running container: the console's page of the app. Sections
# start with "## ", a name and its value are split by a tab.
actions:
  info:
    summary: what runs in it — Node, its versions, the project's packages, environment (the console's page of it)
    command:
      - sh
      - -c
      - |
        node - <<'JS'
        const os = require('node:os');
        const hidden = /PASS|SECRET|TOKEN|KEY|CREDENTIAL/i;
        const row = (name, value) => console.log(`${name}\t${value}`);
        console.log('## Node');
        row('executable', process.execPath);
        row('platform', `${process.platform} ${process.arch} ${os.release()}`);
        row('user', `${os.userInfo().username} (${process.getuid()}:${process.getgid()})`);
        row('directory', process.cwd());
        console.log('## Versions');
        for (const [name, version] of Object.entries(process.versions)) row(name, version);
        console.log('## Environment');
        for (const k of Object.keys(process.env).sort()) row(k, hidden.test(k) ? '<hidden>' : process.env[k]);
        JS
        echo "## Packages (npm ls)"
        npm ls --depth=0 2>&1 || true
