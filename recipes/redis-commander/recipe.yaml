# Redis Commander at http://redis.<project>.localhost, connected to the project's Redis or
# Valkey — the service that provides `redis`: its keys by prefix, their values (strings,
# hashes, lists, sets, sorted sets, streams), and a command line. No login of its own: a
# development viewer, answering only on the machine, like every route of the edge. It runs
# as the image's own unprivileged user, and keeps nothing.
title: Redis Commander
summary: Web viewer of the project's Redis or Valkey at http://redis.<project>.localhost.
icon: icon.svg
image: ghcr.io/joeferner/redis-commander:0.9
unpinned: true
requires:
  - capability: redis
    env:
      REDIS_HOSTS: "{{provider.host}}:{{provider.host}}:{{provider.port}}"
port: 8081
route: { subdomain: redis }
# The image's own check, more often than its once a minute: the console shows it ready sooner.
health:
  test: [CMD, /redis-commander/bin/healthcheck.js]
  intervalMs: 2000
  retries: 30
profiles: [dev]
tmpfs: [/tmp]
limits: { memory: 256m, cpus: "1", pids: 256 }
