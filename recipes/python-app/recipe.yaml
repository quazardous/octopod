# A Python app: supervisord runs the project's programs — its server (`uvicorn app:app
# --host 0.0.0.0 --port 8000`), its workers, its tasks — declared in octopod.yaml
# (programs:) or in its supervisor_d folder, as the project's user, the project mounted at
# /app. uv is in the image; the dependencies are the project's, installed in the running app
# (octopod shell -- uv sync) into its .venv, which is first on the PATH, never in the image.
# A worker-only project turns the route off (route: false on its service).
title: Python app
summary: supervisord running the project's programs (an ASGI/WSGI server on port 8000, workers, tasks) as the project's user; uv in the image, dependencies in the project's .venv.
icon: icon.svg
image: "python:{{params.python}}-slim"
unpinned: true
build: true
params:
  python: { type: enum, values: ["3.13", "3.12", "3.11"], default: "3.13" }
  # What a driver without a Linux wheel needs to compile in uv sync: mysql for mysqlclient
  # (Django's MariaDB/MySQL driver). System packages only; the driver stays the project's.
  drivers: { type: set, values: [mysql], default: [] }
buildArgs:
  DRIVERS: "{{params.drivers}}"
# Before supervisord, a word in the logs when the dependencies are not installed yet: the
# programs will most likely fail to start, and the way out is to install them.
command:
  - sh
  - -c
  - >-
    if [ -f pyproject.toml ] && [ ! -d .venv ]; then
    echo "python-app: no .venv yet — install the dependencies (octopod shell -- uv sync)" >&2;
    fi;
    exec supervisord -c /etc/octopod/supervisord.conf
supervisor: { config: /etc/octopod/supervisord.conf, programs: [] }
env:
  PYTHONUNBUFFERED: "1"
  # uv uses the image's Python and keeps its cache in the user's home (home: true keeps it).
  UV_PYTHON_DOWNLOADS: never
  UV_LINK_MODE: copy
workspace: /app
home: true
port: 8000
route: true
profiles: [dev]
requires:
  - capability: sql
    env: { DATABASE_URL: "{{provider.url}}" }
    optional: true
  - capability: redis
    env: { REDIS_URL: "{{provider.url}}" }
    optional: true
  - capability: memcached
    env: { MEMCACHED_URL: "{{provider.url}}" }
    optional: true
  - capability: mongodb
    env: { MONGODB_URL: "{{provider.url}}" }
    optional: true
  - capability: smtp
    env: { MAILER_DSN: "{{provider.url}}", SMTP_URL: "{{provider.url}}" }
    optional: true
  - capability: oidc
    env: { OIDC_ISSUER_BASE: "{{provider.issuer_base}}" }
    optional: true
tmpfs: [/tmp]
limits: { memory: 2g, cpus: "2", pids: 1024 }
