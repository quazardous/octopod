# MariaDB, reachable inside the project as host `<service>` on 3306; its URL goes to
# whoever requires `sql`, its address and credentials to whoever requires `mysql` (an
# admin like phpmyadmin). The version is one of the supported LTS releases. The data is
# kept in the project (.octopod/data) unless `persist: false`.
title: MariaDB
summary: Relational database, reachable inside the project as host <service> on port 3306.
image: "mariadb:{{params.version}}"
unpinned: true
build: true
provides: [sql, mysql]
params:
  version: { type: enum, values: ["11.8", "11.4", "10.11", "10.6"], default: "11.4" }
  db: { type: ident, default: app }
  user: { type: ident, default: app }
  password: { type: secret, bytes: 24 }
  root-password: { type: secret, bytes: 24 }
  persist: { type: bool, default: true }
env:
  MARIADB_DATABASE: "{{params.db}}"
  MARIADB_USER: "{{params.user}}"
  MARIADB_PASSWORD: "{{secrets.password}}"
  MARIADB_ROOT_PASSWORD: "{{secrets.root-password}}"
exports:
  host: "{{service}}"
  port: "3306"
  user: "{{params.user}}"
  password: "{{secrets.password}}"
  db: "{{params.db}}"
  url: "mysql://{{params.user}}:{{secrets.password}}@{{service}}:3306/{{params.db}}"
volumes:
  - { name: data, path: /var/lib/mysql, when: persist }
port: 3306
health:
  test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
  intervalMs: 2000
  retries: 30
limits: { memory: 1g, cpus: "1", pids: 512 }
# `octopod run <service> <action>`: the credentials are read in the container, from its
# environment; the password goes through MYSQL_PWD, never a command line.
actions:
  shell:
    summary: the database's shell, as its user
    tty: true
    command: [sh, -c, 'MYSQL_PWD="$MARIADB_PASSWORD" exec mariadb -u"$MARIADB_USER" "$MARIADB_DATABASE"']
  dump:
    summary: the database as SQL, on the standard output (octopod run db dump > dump.sql)
    command: [sh, -c, 'MYSQL_PWD="$MARIADB_PASSWORD" exec mariadb-dump -u"$MARIADB_USER" --single-transaction --routines --triggers --no-tablespaces "$MARIADB_DATABASE"']
  load:
    summary: runs an SQL file in the database (octopod run db load dump.sql)
    input: true
    confirm: replaces in the database what the file holds
    command: [sh, -c, 'MYSQL_PWD="$MARIADB_PASSWORD" exec mariadb -u"$MARIADB_USER" "$MARIADB_DATABASE"']
  reset:
    summary: drops the database and creates it empty
    confirm: deletes everything in the database
    command: [sh, -c, 'export MYSQL_PWD="$MARIADB_PASSWORD"; mariadb-admin -u"$MARIADB_USER" --force drop "$MARIADB_DATABASE" && exec mariadb-admin -u"$MARIADB_USER" create "$MARIADB_DATABASE"']
