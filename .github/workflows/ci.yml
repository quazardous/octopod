name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Typecheck and unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows too: what octopod hands docker there (its environment, paths, line
        # endings) is checked without Docker, which hosted Windows runners cannot give with
        # Linux containers — the integration tests stay on Linux.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run --exclude '**/*.integration.test.ts'

  docker:
    name: Integration tests (real Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: docker version && docker compose version
      # They use their own instance prefix and port: nothing else on the runner is touched.
      - run: npx vitest run src/docker.integration.test.ts
        env:
          # Every docker command octopod runs, with its duration: a hang names itself.
          OCTOPOD_DEBUG: '1'
      - name: What Docker holds, on failure
        if: failure()
        run: docker ps -a && docker network ls

  leaks:
    name: Leak check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-leaks.sh
